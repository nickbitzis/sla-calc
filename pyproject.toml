[project]
name = "slacalc"
version = "1.0.0"
description = "SLA, SLO, and error budget math for service owners."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slacalc = "slacalc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
